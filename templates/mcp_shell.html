<div class="container-fluid py-3">
  <!-- Point d'ancrage racine de la SPA MelodiJS -->
  <div id="mcp-app">
    <!-- Skeleton loader initial pour éviter tout saut de mise en page (Layout Shift) -->
    <div class="ds-card p-4 shadow-sm mb-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="ds-skeleton-line" style="width: 280px; height: 32px;"></div>
        <div class="ds-skeleton-line" style="width: 160px; height: 36px;"></div>
      </div>
      <div class="row g-3 mb-4">
        <div class="col-md-3"><div class="ds-skeleton-line" style="height: 72px;"></div></div>
        <div class="col-md-3"><div class="ds-skeleton-line" style="height: 72px;"></div></div>
        <div class="col-md-3"><div class="ds-skeleton-line" style="height: 72px;"></div></div>
        <div class="col-md-3"><div class="ds-skeleton-line" style="height: 72px;"></div></div>
      </div>
      <div class="ds-skeleton-line mb-3" style="height: 44px;"></div>
      <div class="ds-skeleton-line mb-2" style="height: 38px;"></div>
      <div class="ds-skeleton-line mb-2" style="height: 38px;"></div>
      <div class="ds-skeleton-line mb-2" style="height: 38px;"></div>
    </div>
  </div>
</div>

<!-- ======================================================================= -->
<!-- VUE 1 : CATALOGUE DES OUTILS (ToolsCatalogView)                        -->
<!-- ======================================================================= -->
<template id="tpl-mcp-catalog">
  <div class="mcp-catalog-view">
    <!-- En-tête de page -->
    {{ ds_page_header(
      title=t('mcp_title', 'Model Context Protocol (MCP)'),
      subtitle=t('mcp_subtitle', 'Gestion et catalogue des outils IA exposés par les modules MELODI'),
      icon='smart_toy',
      actions=[
        ds_button(
          label=t('tab_server', 'Supervision Serveur'),
          variant='primary',
          icon='dns',
          extra_attrs='@click="$router.push(\'/server\')"'
        ),
        ds_button(
          label=t('tab_tokens', 'Mes Tokens IA'),
          variant='outline-primary',
          icon='key',
          extra_attrs='@click="$router.push(\'/tokens\')"'
        )
      ]
    ) }}

    <!-- KPIs réactifs -->
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        {{ ds_stat_card(
          title=t('active_tools', 'Outils Actifs'),
          value='[[ activeToolsCount ]]',
          icon='smart_toy',
          color='success',
          subtitle=t('registered_capabilities', 'Capacités enregistrées')
        ) }}
      </div>
      <div class="col-md-3">
        {{ ds_stat_card(
          title=t('total_tools', 'Total Outils'),
          value='[[ totalToolsCount ]]',
          icon='extension',
          color='primary',
          subtitle='Catalogue global'
        ) }}
      </div>
      <div class="col-md-3">
        {{ ds_stat_card(
          title=t('catalog_revision', 'Révision du Catalogue'),
          value='[[ catalogRevision.substring(0, 8) ]]',
          icon='tag',
          color='info',
          subtitle=t('contract_version', 'Version') ~ ': v' ~ contract_version
        ) }}
      </div>
      <div class="col-md-3">
        {{ ds_stat_card(
          title=t('api_endpoint', 'Point d\'accès API'),
          value='/api/melodi_mcp',
          icon='api',
          color='secondary',
          subtitle='REST Interne Sécurisé'
        ) }}
      </div>
    </div>

    <!-- Barre de recherche, filtres et bascule affichage -->
    <div class="ds-card p-4 shadow-sm mb-4">
      <div class="row g-3 align-items-center mb-3">
        <div class="col-md-4">
          <input type="search" class="ds-input w-100" v-model="searchQuery"
                 placeholder="{{ t('search_tools_placeholder', 'Rechercher par nom, description, catégorie ou module...') }}">
        </div>
        <div class="col-md-2">
          <select class="ds-select w-100" v-model="selectedCategory">
            <option value="">{{ t('filter_all_categories', 'Toutes les catégories') }}</option>
            <option v-for="cat in categories" :key="cat" :value="cat">[[ cat ]]</option>
          </select>
        </div>
        <div class="col-md-2">
          <select class="ds-select w-100" v-model="selectedModule">
            <option value="">{{ t('filter_all_modules', 'Tous les modules') }}</option>
            <option v-for="mod in modules" :key="mod" :value="mod">[[ mod ]]</option>
          </select>
        </div>
        <div class="col-md-2">
          <select class="ds-select w-100" v-model="selectedType">
            <option value="">{{ t('filter_all_types', 'Tous les types') }}</option>
            <option value="read_only">{{ t('read_only', 'Lecture seule') }}</option>
            <option value="write">{{ t('write_operation', 'Écriture') }}</option>
            <option value="destructive">{{ t('destructive', 'Destructif') }}</option>
          </select>
        </div>
        <div class="col-md-2 d-flex justify-content-end gap-1">
          <button type="button" class="ds-btn ds-btn-sm" :class="viewMode === 'table' ? 'ds-btn-primary' : 'ds-btn-secondary'" @click="setViewMode('table')" title="{{ t('view_table', 'Table') }}">
            <img src="/static_base_icons?name=table_rows&fill=currentColor" style="width: 14px; height: 14px;" alt="">
          </button>
          <button type="button" class="ds-btn ds-btn-sm" :class="viewMode === 'cards' ? 'ds-btn-primary' : 'ds-btn-secondary'" @click="setViewMode('cards')" title="{{ t('view_cards', 'Cartes') }}">
            <img src="/static_base_icons?name=grid_view&fill=currentColor" style="width: 14px; height: 14px;" alt="">
          </button>
        </div>
      </div>

      <!-- Vue Cartes -->
      <div v-if="filteredTools.length > 0 && viewMode === 'cards'" class="row g-3">
        <div class="col-md-6 col-lg-4" v-for="tool in filteredTools" :key="tool.name">
          <div class="ds-card p-3 mcp-tool-card h-100 d-flex flex-column justify-content-between">
            <div>
              <div class="d-flex align-items-center justify-content-between mb-2">
                <span class="ds-badge ds-badge-primary">[[ tool.module ]]</span>
                <span class="ds-badge" :class="tool.read_only ? 'ds-badge-success' : 'ds-badge-warning'">
                  [[ tool.read_only ? '{{ t('read_only', 'Lecture') }}' : '{{ t('write_operation', 'Écriture') }}' ]]
                </span>
              </div>
              <h5 class="fw-bold mb-1">[[ tool.name ]]</h5>
              <p class="ds-text-sm text-muted mb-3 text-truncate-3">[[ tool.description ]]</p>
            </div>
            <div>
              <div class="d-flex flex-wrap gap-1 mb-3">
                <span v-for="p in tool.required_permissions" :key="p" class="ds-badge ds-badge-light font-monospace ds-text-xs">
                  [[ p ]]
                </span>
                <span v-if="!tool.required_permissions || !tool.required_permissions.length" class="ds-text-xs text-muted">
                  {{ t('public_authenticated', 'Authentifié') }}
                </span>
              </div>
              <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                <span class="ds-text-xs text-muted font-monospace">v[[ tool.version || '1.0.0' ]]</span>
                <button type="button" class="ds-btn ds-btn-sm ds-btn-outline-primary" @click="openSchemaModal(tool)">
                  <img src="/static_base_icons?name=code&fill=currentColor" style="width: 12px; height: 12px; vertical-align: middle;" alt="">
                  <span>{{ t('view_schema', 'Schéma') }}</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Vue Tableau -->
      <div v-else-if="filteredTools.length > 0" class="table-responsive">
        <table class="ds-table w-100">
          <thead>
            <tr>
              <th>{{ t('tool_name', 'Nom de l\'outil') }}</th>
              <th>{{ t('module', 'Module') }}</th>
              <th>{{ t('category', 'Catégorie') }}</th>
              <th>{{ t('required_permissions_col', 'Permissions') }}</th>
              <th>{{ t('type', 'Type') }}</th>
              <th>{{ t('version', 'Version') }}</th>
              <th class="text-end">{{ t('actions', 'Actions') }}</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="tool in filteredTools" :key="tool.name">
              <td>
                <strong class="d-block">[[ tool.name ]]</strong>
                <div class="ds-text-xs text-muted text-truncate" style="max-width: 320px;">[[ tool.description ]]</div>
              </td>
              <td><span class="ds-badge ds-badge-light">[[ tool.module ]]</span></td>
              <td><span class="ds-badge ds-badge-secondary">[[ tool.category ]]</span></td>
              <td>
                <div v-if="tool.required_permissions && tool.required_permissions.length" class="d-flex flex-wrap gap-1">
                  <code v-for="p in tool.required_permissions" :key="p" class="px-2 py-1 rounded bg-light border font-monospace ds-text-xs">[[ p ]]</code>
                </div>
                <span v-else class="ds-text-xs text-muted">{{ t('public_authenticated', 'Authentifié') }}</span>
              </td>
              <td>
                <span class="ds-badge" :class="tool.read_only ? 'ds-badge-success' : 'ds-badge-warning'">
                  [[ tool.read_only ? '{{ t('read_only', 'Lecture') }}' : '{{ t('write_operation', 'Écriture') }}' ]]
                </span>
                <span v-if="tool.destructive" class="ds-badge ds-badge-danger ms-1">{{ t('destructive', 'Destructif') }}</span>
              </td>
              <td><code>v[[ tool.version || '1.0.0' ]]</code></td>
              <td class="text-end">
                <button type="button" class="ds-btn ds-btn-sm ds-btn-outline-primary" @click="openSchemaModal(tool)">
                  <img src="/static_base_icons?name=code&fill=currentColor" style="width: 12px; height: 12px; vertical-align: middle;" alt="">
                  <span>{{ t('view_schema', 'Schéma') }}</span>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- État vide -->
      <div v-else class="py-5 text-center">
        {{ ds_empty_state(
          title=t('no_tools_found', 'Aucun outil MCP trouvé'),
          description='Modifiez vos critères de recherche ou réinitialisez les filtres.',
          icon='search_off'
        ) }}
      </div>
    </div>

    <!-- Modal Inspection de Schéma JSON -->
    <div v-if="showSchemaModal" class="mcp-modal-backdrop" @click.self="closeSchemaModal">
      <div class="mcp-modal-card">
        <div class="p-3 border-bottom d-flex align-items-center justify-content-between">
          <div class="d-flex align-items-center gap-2">
            <img src="/static_base_icons?name=code&fill=%232563eb" style="width: 20px; height: 20px;" alt="">
            <h5 class="fw-bold mb-0">[[ selectedToolForSchema ? selectedToolForSchema.name : '' ]] - {{ t('input_schema', 'Schéma d\'arguments') }}</h5>
          </div>
          <button type="button" class="ds-btn ds-btn-sm ds-btn-secondary" @click="closeSchemaModal">✕</button>
        </div>
        <div class="mcp-modal-body">
          <p class="ds-text-sm text-muted mb-2">[[ selectedToolForSchema ? selectedToolForSchema.description : '' ]]</p>
          <div class="mcp-code-block">
            <button type="button" class="ds-btn ds-btn-sm ds-btn-outline-light mcp-copy-btn" @click="copySchemaJson">
              <img src="/static_base_icons?name=content_copy&fill=white" style="width: 12px; height: 12px; vertical-align: middle;" alt="">
              <span>Copier JSON</span>
            </button>
            <pre><code>[[ getFormattedSchema() ]]</code></pre>
          </div>
        </div>
        <div class="p-3 border-top d-flex justify-content-end gap-2">
          <button type="button" class="ds-btn ds-btn-secondary" @click="closeSchemaModal">{{ t('close', 'Fermer') }}</button>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- ======================================================================= -->
<!-- VUE 2 : SUPERVISION SERVEUR (ServerSupervisorView)                     -->
<!-- ======================================================================= -->
<template id="tpl-mcp-server">
  <div class="mcp-server-view">
    {{ ds_page_header(
      title=t('tab_server', 'Supervision Serveur MCP'),
      subtitle='Supervision en direct, liaison réseau et commandes de pilotage de l\'instance melodi_mcp_server.',
      icon='dns',
      actions=[
        ds_button(
          label=t('server_ping_live', 'Tester la connexion'),
          variant='primary',
          icon='refresh',
          extra_attrs='@click="onPing" :disabled="isPinging"'
        ),
        ds_button(
          label=t('server_force_sync', 'Forcer la synchronisation'),
          variant='secondary',
          icon='sync',
          extra_attrs='@click="onSync" :disabled="isSyncing || !isOnline"'
        )
      ]
    ) }}

    <!-- KPIs réactifs en direct -->
    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="ds-card p-3 shadow-sm h-100">
          <div class="ds-text-muted ds-text-xs mb-1">État du Serveur MCP</div>
          <div class="d-flex align-items-center gap-2 mb-2">
            <span class="mcp-pulse-dot" :class="isOnline ? 'healthy' : 'unhealthy'"></span>
            <strong class="ds-h4 mb-0" :class="isOnline ? 'text-success' : 'text-danger'">
              [[ isOnline ? '{{ t('server_status_online', 'EN LIGNE') }}' : '{{ t('server_status_offline', 'HORS LIGNE') }}' ]]
            </strong>
          </div>
          <div class="d-flex align-items-center justify-content-between ds-text-xs">
            <span class="text-muted">{{ t('latency_label', 'Latence') }} :</span>
            <span class="mcp-latency-meter" :class="latencyClass">[[ latencyMs ]] ms</span>
          </div>
        </div>
      </div>

      <div class="col-md-3">
        {{ ds_stat_card(
          title='Outils Serveur MCP',
          value='[[ isOnline ? serverToolsCount : \'-\' ]]',
          icon='tune',
          color='info',
          subtitle='Sur ' ~ '[[ totalErpTools ]]' ~ ' outils ERP disponibles'
        ) }}
      </div>

      <div class="col-md-3">
        {{ ds_stat_card(
          title='Uptime du Serveur',
          value='[[ isOnline ? uptime : \'-\' ]]',
          icon='schedule',
          color='secondary',
          subtitle='Version protocole: ' ~ '[[ version ]]'
        ) }}
      </div>

      <div class="col-md-3">
        <div class="ds-card p-3 shadow-sm h-100">
          <div class="ds-text-muted ds-text-xs mb-1">Point de Contact MCP</div>
          <div class="ds-text-xs font-monospace text-truncate fw-bold mb-1" :title="mcpServerUrl">
            [[ mcpServerUrl ]]
          </div>
          <div class="ds-text-xs text-muted">
            Transport : <strong>HTTP Streamable / SSE</strong>
          </div>
        </div>
      </div>
    </div>

    <!-- Détails de la passerelle & Snippet client IA -->
    <div class="row g-4">
      <!-- Colonne Détails Passerelle -->
      <div class="col-md-6">
        <div class="ds-card p-4 shadow-sm h-100">
          <div class="d-flex align-items-center justify-content-between mb-3 pb-2 border-bottom">
            <h5 class="fw-bold mb-0">Détails de la Liaison Passerelle</h5>
            <span class="ds-badge ds-badge-primary">Architecture</span>
          </div>

          <table class="ds-table w-100">
            <tbody>
              <tr>
                <td class="text-muted ds-text-xs fw-bold" style="width: 45%;">URL Base Serveur :</td>
                <td class="ds-text-xs font-monospace">[[ serverBaseUrl ]]</td>
              </tr>
              <tr>
                <td class="text-muted ds-text-xs fw-bold">Endpoint Santé :</td>
                <td class="ds-text-xs font-monospace">[[ serverBaseUrl ]]/health</td>
              </tr>
              <tr>
                <td class="text-muted ds-text-xs fw-bold">Endpoint MCP SSE :</td>
                <td class="ds-text-xs font-monospace">[[ mcpServerUrl ]]</td>
              </tr>
              <tr>
                <td class="text-muted ds-text-xs fw-bold">Webhook Révocation :</td>
                <td class="ds-text-xs font-monospace">[[ serverBaseUrl ]]/api/mcp/tokens/revoke</td>
              </tr>
              <tr>
                <td class="text-muted ds-text-xs fw-bold">Révision Serveur vs ERP :</td>
                <td class="ds-text-xs font-monospace">[[ serverRevision.substring(0, 8) ]] / [[ catalogRevision.substring(0, 8) ]]</td>
              </tr>
            </tbody>
          </table>

          <div class="mt-4 pt-3 border-top d-flex gap-2 justify-content-end">
            <button type="button" class="ds-btn ds-btn-sm ds-btn-outline-secondary" @click="goToManifest">
              <img src="/static_base_icons?name=settings&fill=currentColor" style="width: 14px; height: 14px; vertical-align: middle;" alt="">
              <span>{{ t('tab_manifest', 'Modifier les Clés de Sécurité') }}</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Colonne Configuration Client IA -->
      <div class="col-md-6">
        <div class="ds-card p-4 shadow-sm h-100">
          <div class="d-flex align-items-center justify-content-between mb-2 pb-2 border-bottom">
            <h5 class="fw-bold mb-0">Configuration Client IA</h5>
            <span class="ds-badge ds-badge-info">Cursor / Claude / Copilot</span>
          </div>
          <p class="ds-text-xs text-muted mb-3">
            Collez cet extrait dans votre fichier <code>.mcp.json</code> (Cursor, VS Code) pour connecter vos agents IA :
          </p>

          <div class="mcp-code-block mb-3">
            <button type="button" class="ds-btn ds-btn-sm ds-btn-outline-light mcp-copy-btn" @click="copyClientSnippet">
              <img src="/static_base_icons?name=content_copy&fill=white" style="width: 12px; height: 12px; vertical-align: middle;" alt="">
              <span>{{ t('copy_config_json', 'Copier') }}</span>
            </button>
            <pre><code>[[ clientSnippet ]]</code></pre>
          </div>

          <div class="text-end">
            <button type="button" class="ds-btn ds-btn-sm ds-btn-primary" @click="goToTokens">
              <img src="/static_base_icons?name=key&fill=white" style="width: 12px; height: 12px; vertical-align: middle;" alt="">
              <span>→ {{ t('generate_user_token_button', 'Générer mon Token MCP') }}</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- ======================================================================= -->
<!-- VUE 3 : MES TOKENS MCP (UserTokensView)                                -->
<!-- ======================================================================= -->
<template id="tpl-mcp-tokens">
  <div class="mcp-tokens-view">
    {{ ds_page_header(
      title=t('user_tokens_title', 'Mes Tokens MCP (Agents IA)'),
      subtitle=t('user_tokens_subtitle', 'Générez un jeton JWT personnel (valable entre 1h et 72h max) pour connecter vos agents IA.'),
      icon='key',
      actions=[
        ds_button(
          label=t('tab_catalog', 'Catalogue Outils'),
          variant='secondary',
          icon='extension',
          extra_attrs='@click="$router.push(\'/\')"'
        ),
        ds_button(
          label=t('tab_server', 'Supervision'),
          variant='primary',
          icon='dns',
          extra_attrs='@click="$router.push(\'/server\')"'
        )
      ]
    ) }}

    <!-- Carte Contexte Utilisateur Connecté -->
    <div class="ds-card p-4 shadow-sm mb-4 border-start border-4 border-primary">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
        <div>
          <span class="ds-text-xs text-muted text-uppercase fw-bold">{{ t('connected_user_label', 'Utilisateur en cours') }}</span>
          <div class="d-flex align-items-center gap-2 mt-1">
            <h4 class="fw-bold mb-0">[[ currentUsername ]]</h4>
            <span v-if="isSudo" class="ds-badge ds-badge-danger">{{ t('sudo_all_permissions', 'Super-Administrateur (*)') }}</span>
            <span v-else class="ds-badge ds-badge-primary">{{ t('standard_user_badge', 'Permissions actives') }}</span>
          </div>
        </div>
        <div class="text-end">
          <span class="ds-text-xs text-muted d-block mb-1">{{ t('inherited_permissions_label', 'Permissions vérifiées par MCP :') }}</span>
          <div v-if="isSudo">
            <code class="px-2 py-1 rounded bg-light border font-monospace ds-text-xs">* ({{ t('all_tools_allowed', 'Accès total') }})</code>
          </div>
          <div v-else-if="permissions.length" class="d-flex flex-wrap gap-1 justify-content-end">
            <code v-for="p in permissions.slice(0, 6)" :key="p" class="px-2 py-1 rounded bg-light border font-monospace ds-text-xs">[[ p ]]</code>
            <span v-if="permissions.length > 6" class="ds-badge ds-badge-secondary">+[[ permissions.length - 6 ]]</span>
          </div>
          <div v-else class="ds-text-xs text-muted">
            {{ t('no_specific_permissions', 'Outils publics uniquement') }}
          </div>
        </div>
      </div>
    </div>

    <!-- Alerte Nouveau Jeton Généré -->
    <div v-if="newlyCreatedToken" class="ds-card p-4 shadow-sm mb-4 border border-success" style="background: rgba(16, 185, 129, 0.05);">
      <h5 class="fw-bold text-success mb-1">✓ {{ t('token_generated_success', 'Jeton MCP personnel généré avec succès !') }}</h5>
      <p class="ds-text-xs text-muted mb-3">{{ t('token_copy_warning', 'Attention : copiez immédiatement ce jeton. Il ne sera plus réaffiché en clair.') }}</p>

      <div class="d-flex align-items-center gap-2 mb-3">
        <input type="text" class="ds-input font-monospace fw-bold w-100" style="max-width: 580px; background: #fff;" :value="newlyCreatedToken" readonly>
        <button type="button" class="ds-btn ds-btn-success" @click="copyNewToken">
          <img src="/static_base_icons?name=content_copy&fill=white" style="width: 14px; height: 14px; vertical-align: middle;" alt="">
          <span>{{ t('copy_token', 'Copier mon jeton') }}</span>
        </button>
      </div>

      <div class="p-3 bg-white border rounded">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <strong class="ds-text-xs">{{ t('mcp_config_title', 'Configuration .mcp.json prête à l\'emploi :') }}</strong>
          <button type="button" class="ds-btn ds-btn-sm ds-btn-primary" @click="copyMcpConfig">
            <img src="/static_base_icons?name=content_copy&fill=white" style="width: 12px; height: 12px; vertical-align: middle;" alt="">
            <span>{{ t('copy_config_json', 'Copier la configuration JSON') }}</span>
          </button>
        </div>
        <pre class="p-3 bg-light border rounded font-monospace ds-text-xs mb-0" style="max-height: 180px; overflow-y: auto;"><code>[[ mcpConfigSnippet ]]</code></pre>
      </div>
    </div>

    <!-- Grille : Formulaire création + Liste des tokens -->
    <div class="row g-4 mb-4">
      <!-- Formulaire Création -->
      <div class="col-md-4">
        <div class="ds-card p-4 shadow-sm h-100">
          <h5 class="fw-bold mb-2">{{ t('create_user_token_title', 'Créer un Jeton pour mon Agent') }}</h5>
          <p class="ds-text-xs text-muted mb-3">{{ t('create_user_token_desc', 'Jeton JWT intégrant votre identité et vos autorisations.') }}</p>

          <form @submit.prevent="handleCreateToken">
            <div class="mb-3">
              <label class="ds-label mb-1">{{ t('agent_name_label', 'Nom de votre Agent IA') }} *</label>
              <input type="text" class="ds-input w-100" v-model="agentName" placeholder="{{ t('agent_name_placeholder', 'ex: Claude Desktop, Cursor, Mon Assistant') }}" required>
            </div>

            <div class="mb-4">
              <label class="ds-label mb-1">{{ t('key_expires_in_hours_label', 'Durée de validité (1h à 72h max)') }}</label>
